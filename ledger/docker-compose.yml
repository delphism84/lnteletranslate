# 가계부 봇 (polling 모드 — 웹훅/포트/인증서 불필요)
# 준비: cp config.example.json config.json 후 토큰·DB 비밀번호 입력
# 실행: docker compose up -d --build
services:
  lnledger:
    build: .
    container_name: lnledger
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./config.json:/app/config.json:ro
      # 번역봇이 쌓는 대화 로그. 읽기 전용 — 번역봇 동작에 전혀 영향을 주지 않는다.
      - ../data/tra:/app/covert-data:ro
    networks:
      # lunar-mariadb 가 붙어 있는 네트워크. 컨테이너명(lunar-mariadb)으로 접속한다.
      - mariadb

networks:
  mariadb:
    external: true
    name: docker-mariadb_default
