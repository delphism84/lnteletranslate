<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>SessionBootstrap.java</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #010409;
      --panel: #161b22;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --kw: #ff7b72;
      --str: #a5d6ff;
      --cmt: #8b949e;
      --num: #79c0ff;
      --type: #ffa657;
      --gutter: #6e7681;
      --hilite: rgba(88, 166, 255, 0.14);
      --danger: #f85149;
      --ok: #3fb950;
      --bar: #161b22;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg2);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    /* PIN gate */
    #gate {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px calc(28px + var(--safe-bottom));
      background:
        radial-gradient(600px 280px at 50% 0%, #1a2332 0%, transparent 60%),
        var(--bg);
    }
    #gate.hidden { display: none; }
    #gate h1 {
      margin: 0 0 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    #gate p { margin: 0 0 22px; color: var(--gutter); font-size: 0.78rem; }
    #gate .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }
    #pinInput {
      width: 100%;
      font: inherit;
      font-size: 1.4rem;
      letter-spacing: 0.35em;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    #pinInput:focus { border-color: var(--accent); }
    #unlockBtn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #gateErr { margin-top: 10px; color: var(--danger); font-size: 0.8rem; min-height: 1.2em; text-align: center; }

    #app { display: none; flex-direction: column; height: 100dvh; }
    #app.show { display: flex; }

    .titlebar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font-size: 0.75rem;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f7768e; }
    .dot:nth-child(2) { background: #e0af68; }
    .dot:nth-child(3) { background: #9ece6a; }
    .fname { color: var(--muted); margin-left: 4px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--gutter); font-size: 0.7rem; }

    .editor {
      flex: 1 1 auto;
      overflow: auto;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
    }
    .code {
      display: grid;
      grid-template-columns: 52px 1fr;
      min-width: 100%;
      font-size: 12px;
      line-height: 1.55;
      padding-bottom: 12px;
    }
    .gutter, .source { margin: 0; padding: 8px 0; }
    .gutter {
      text-align: right;
      padding-right: 10px;
      color: var(--gutter);
      user-select: none;
      border-right: 1px solid var(--line);
      background: #0d1117;
    }
    .source { padding-left: 12px; padding-right: 12px; white-space: pre; overflow-x: auto; }
    .ln, .sl {
      display: block;
      min-height: 1.55em;
      padding: 0 2px;
    }
    .sl.hit {
      background: rgba(88, 166, 255, 0.28);
      box-shadow: inset 4px 0 0 #58a6ff;
    }
    .sl.hit-dim {
      background: rgba(88, 166, 255, 0.16);
      box-shadow: inset 3px 0 0 rgba(88, 166, 255, 0.7);
    }
    .gutter .ln.hit { color: var(--accent); font-weight: 600; }
    .gutter .ln.hit-dim { color: #79b8ff; }
    .tok-kw { color: var(--kw); }
    .tok-type { color: var(--type); }
    .tok-str { color: var(--str); }
    .tok-cmt { color: var(--cmt); font-style: italic; }
    .tok-num { color: var(--num); }

    .bottom {
      flex: 0 0 auto;
      background: var(--bar);
      border-top: 1px solid var(--line);
      padding: 8px 10px calc(8px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
    }
    .nav button, .send-row button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 11px 10px;
      cursor: pointer;
    }
    .nav button:disabled { opacity: 0.35; }
    .nav .pos { text-align: center; color: var(--muted); font-size: 0.75rem; }
    .send-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    #msgInput {
      width: 100%;
      resize: none;
      min-height: 42px;
      max-height: 96px;
      font: inherit;
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    #msgInput:focus { border-color: var(--accent); }
    #sendBtn {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
      min-width: 64px;
    }
    #sendBtn:disabled { opacity: 0.45; }
    #status {
      font-size: 0.7rem;
      color: var(--muted);
      min-height: 1em;
    }
    #status.err { color: var(--danger); }
    #status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <div id="gate">
    <h1>com.lunar.runtime.cfg</h1>
    <p>SessionBootstrap · build access</p>
    <div class="card">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="····" autocomplete="off" />
      <button type="button" id="unlockBtn">Continue</button>
      <div id="gateErr"></div>
    </div>
  </div>

  <div id="app">
    <div class="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="fname">SessionBootstrap.java</span>
      <span class="meta" id="fileMeta">UTF-8</span>
    </div>
    <div class="editor" id="editor">
      <div class="code">
        <pre class="gutter" id="gutter"></pre>
        <pre class="source" id="source"></pre>
      </div>
    </div>
    <div class="bottom">
      <div class="nav">
        <button type="button" id="btnPrev">이전줄</button>
        <div class="pos" id="posLabel">—</div>
        <button type="button" id="btnNext">다음줄</button>
      </div>
      <div class="send-row">
        <textarea id="msgInput" rows="1" placeholder="메시지 (한글)"></textarea>
        <button type="button" id="sendBtn">전송</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    const state = { index: 0, count: 0, chatLineIndex: 0, chatLineIndices: [], loading: false };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlightJava(line) {
      let s = escapeHtml(line);
      if (/^\s*\/\//.test(line) || /^\s*\*/.test(line) || /^\s*\/\*/.test(line)) {
        return `<span class="tok-cmt">${s}</span>`;
      }
      s = s.replace(/(&quot;.*?&quot;)/g, '<span class="tok-str">$1</span>');
      s = s.replace(/\b(package|import|public|private|protected|static|final|class|void|return|if|for|new|boolean|int|byte|volatile)\b/g,
        '<span class="tok-kw">$1</span>');
      s = s.replace(/\b(String|StringBuilder|List|Map|ArrayList|HashMap|AtomicInteger|MessageDigest|System|SessionBootstrap)\b/g,
        '<span class="tok-type">$1</span>');
      s = s.replace(/\b(\d+)\b/g, '<span class="tok-num">$1</span>');
      s = s.replace(/(\/\/.*)$/g, '<span class="tok-cmt">$1</span>');
      return s;
    }

    function renderLines(lines, chatLineIndex, chatLineIndices) {
      const hits = new Set(chatLineIndices || []);
      const g = $("gutter");
      const src = $("source");
      const gParts = [];
      const sParts = [];
      for (let i = 0; i < lines.length; i++) {
        let cls = "";
        if (i === chatLineIndex) cls = " hit";
        else if (hits.has(i)) cls = " hit-dim";
        gParts.push(`<span class="ln${cls}">${i + 1}</span>`);
        sParts.push(`<span class="sl${cls}" data-i="${i}">${highlightJava(lines[i])}</span>`);
      }
      g.innerHTML = gParts.join("");
      src.innerHTML = sParts.join("");
      requestAnimationFrame(() => {
        const el = src.querySelector(".sl.hit") || src.querySelector(".sl.hit-dim");
        if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      });
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || res.statusText);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    async function loadView(index) {
      if (state.loading) return;
      state.loading = true;
      setStatus("loading…");
      try {
        const q = Number.isFinite(index) ? `?index=${index}` : "";
        const data = await api("/api/view" + q);
        state.index = data.index;
        state.count = data.count;
        state.chatLineIndex = data.chatLineIndex;
        state.chatLineIndices = data.chatLineIndices || [];
        renderLines(data.lines || [], data.chatLineIndex, state.chatLineIndices);
        const role = data.chat?.role === "me" ? "out" : data.chat?.role === "tra" ? "in" : "-";
        const label = data.count
          ? `${data.index + 1} / ${data.count} · L${data.chatLineIndex + 1} · ${role}`
          : "no frames";
        $("posLabel").textContent = label;
        $("fileMeta").textContent = data.count ? `${data.count}/20 ko` : "empty";
        $("btnPrev").disabled = !data.count || data.index <= 0;
        $("btnNext").disabled = !data.count || data.index >= data.count - 1;
        setStatus("");
      } catch (e) {
        if (e.status === 401) return showGate();
        setStatus(e.message, "err");
      } finally {
        state.loading = false;
      }
    }

    function setStatus(msg, cls = "") {
      const el = $("status");
      el.textContent = msg || "";
      el.className = cls;
    }

    function showGate() {
      $("gate").classList.remove("hidden");
      $("app").classList.remove("show");
    }
    function showApp() {
      $("gate").classList.add("hidden");
      $("app").classList.add("show");
    }

    $("unlockBtn").addEventListener("click", unlock);
    $("pinInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") unlock();
    });

    async function unlock() {
      $("gateErr").textContent = "";
      try {
        await api("/api/unlock", {
          method: "POST",
          body: JSON.stringify({ pin: $("pinInput").value }),
        });
        $("pinInput").value = "";
        showApp();
        await loadView();
      } catch {
        $("gateErr").textContent = "access denied";
      }
    }

    $("btnPrev").addEventListener("click", () => {
      if (state.index > 0) loadView(state.index - 1);
    });
    $("btnNext").addEventListener("click", () => {
      if (state.index < state.count - 1) loadView(state.index + 1);
    });

    $("sendBtn").addEventListener("click", sendMsg);
    $("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });

    async function sendMsg() {
      const text = $("msgInput").value.trim();
      if (!text) return;
      $("sendBtn").disabled = true;
      setStatus("sending…");
      try {
        const data = await api("/api/send", {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        $("msgInput").value = "";
        setStatus("sent", "ok");
        await loadView(data.index);
      } catch (e) {
        if (e.status === 401) return showGate();
        setStatus(e.message || "failed", "err");
      } finally {
        $("sendBtn").disabled = false;
      }
    }

    (async () => {
      try {
        const s = await api("/api/session");
        if (s.ok) {
          showApp();
          await loadView();
        }
      } catch {
        /* stay on gate */
      }
    })();
  </script>
</body>
</html>
