# c.dair.co.kr — Tra covert viewer
# certbot: certbot certonly --webroot -w /var/www/html -d c.dair.co.kr

server {
  listen 80;
  listen [::]:80;
  server_name c.dair.co.kr;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name c.dair.co.kr;

  ssl_certificate /etc/letsencrypt/live/c.dair.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/c.dair.co.kr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/c_dair_access.log;
  error_log  /var/log/nginx/c_dair_error.log;

  location / {
    proxy_pass http://127.0.0.1:64010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
